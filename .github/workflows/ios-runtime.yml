name: Real iOS runtime probe
on:
  workflow_dispatch:
    inputs:
      dashboard_session:
        description: Dashboard-created session ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      TCGEN_DASHBOARD_SESSION: ${{ inputs.dashboard_session }}
    steps:
      - uses: actions/checkout@v4
      - name: Boot, build, install, launch and exercise the native app
        run: python3 ci_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-runtime-${{ github.run_id }}
          path: evidence
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ios-provenance-${{ github.run_id }}
          path: |
            evidence/*.json
            evidence/*.txt
            evidence/*.log
            evidence/*.har
            evidence/*.zip
          retention-days: 7
